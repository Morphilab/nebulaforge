name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # setup-uv v10.2.0 pinned SHA, uv 0.12.24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install (app + dev)
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run linting (flake8)
        run: |
          uv run --no-sync flake8 nebulaforge/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run type checking (mypy)
        run: |
          uv run --no-sync mypy nebulaforge/ --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ -v --tb=short --cov=nebulaforge --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Install app and dev tools
        run: uv sync --frozen --extra dev --python "3.12"

      - name: Run Bandit (SAST)
        run: |
          uv run --with bandit bandit -r nebulaforge/ -f json -o bandit-report.json || true
          uv run --with bandit bandit -r nebulaforge/ -ll

      - name: Run Safety (dependency check, blocking)
        run: |
          uv run --no-sync safety check --policy-file .safety-policy.yml --output json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
