[project]
name = "nebulaforge"
version = "1.0.0"
description = "Forge secure, auditable Conda environments with enterprise-grade security"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Morphilab", email = "lab@morphilab.com"}]
requires-python = ">=3.8"
keywords = ["conda", "environment", "security", "devops", "reproducibility", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "packaging>=23.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

[project.scripts]
nebulaforge = "nebulaforge.__main__:main"

[project.urls]
"Homepage" = "https://github.com/Morphilab/nebulaforge"
"Bug Tracker" = "https://github.com/Morphilab/nebulaforge/issues"

[tool.setuptools.packages.find]
include = ["nebulaforge*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "S110", "S112", "UP006", "UP045"]
# S101: allow assert (used in tests and validation logic)
# E501: line too long (handled by formatter)
# S110/S112: try-except-pass/continue is intentional in cleanup/fallback paths
# UP006/UP045: use List[X]/Optional[X] for Python 3.8+ compatibility

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", "backups", "dist", "build"]
skips = ["B110", "B112"]
